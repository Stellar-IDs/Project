[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
soroban-sdk = "28"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Release profile tuned for contract size (Soroban contract-size limits).
# Values follow the Stellar CLI template baseline.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Keeps contract log output for debugging. Never deploy this profile.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
