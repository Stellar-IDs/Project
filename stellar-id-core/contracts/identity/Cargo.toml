[package]
name = "stellar-id-core"
description = "Soroban contract implementing the did:stellar DID method (Phase 0 scaffold)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Phase 2: real Ed25519 key generation + signing in tests, SHA-256 for
# test-vector hashing. Versions match the transitive tree (see Cargo.lock:
# ed25519-dalek 2.2.0, rand 0.8.8, sha2 0.10.9) — no version drift.
ed25519-dalek = "2"
rand = "0.8"
sha2 = "0.10"
